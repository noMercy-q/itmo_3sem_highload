x-kafka-env: &kafka-env
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:9094
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_LOG_RETENTION_HOURS: 1
  KAFKA_LOG_SEGMENT_BYTES: 8388608
  KAFKA_METADATA_LOG_SEGMENT_BYTES: 8388608
  KAFKA_LOG_CLEANER_DEDUPE_BUFFER_SIZE: 16777216
  KAFKA_NUM_NETWORK_THREADS: 2
  KAFKA_NUM_IO_THREADS: 2
  KAFKA_BACKGROUND_THREADS: 2
  KAFKA_HEAP_OPTS: -Xms64m -Xmx128m
  KAFKA_JVM_PERFORMANCE_OPTS: -XX:+UseG1GC -XX:ActiveProcessorCount=1 -XX:MaxDirectMemorySize=32m -XX:MaxMetaspaceSize=96m

x-kafka: &kafka
  image: apache/kafka:4.1.1
  mem_limit: 320m
  memswap_limit: 640m
  stop_grace_period: 30s
  healthcheck:
    test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9092'"]
    interval: 10s
    timeout: 3s
    start_period: 30s
    retries: 15

x-app-env: &app-env
  KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
  SINK_PATH: /data/sink.sqlite3
  GITHUB_LOGIN: ${GITHUB_LOGIN:-noMercy-q}
  KEY_MODE: ${KEY_MODE:-user_id}
  EVENTS_PER_SECOND: ${EVENTS_PER_SECOND:-12}
  USERS_PER_PRODUCER: ${USERS_PER_PRODUCER:-7}
  EVENT_LIMIT: ${EVENT_LIMIT:-0}
  PROCESSING_DELAY_MS: ${PROCESSING_DELAY_MS:-40}
  AFTER_SINK_DELAY_MS: ${AFTER_SINK_DELAY_MS:-0}

x-app: &app
  image: hw3-lab:local
  build: .
  init: true
  mem_limit: 128m
  stop_grace_period: 40s
  volumes:
    - sink:/data

x-worker: &worker
  <<: *app
  depends_on:
    initialize:
      condition: service_completed_successfully

services:
  kafka-1:
    <<: *kafka
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,HOST://localhost:19092
    ports:
      - "127.0.0.1:19092:9094"
    volumes:
      - kafka-1:/var/lib/kafka/data

  kafka-2:
    <<: *kafka
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,HOST://localhost:29092
    ports:
      - "127.0.0.1:29092:9094"
    volumes:
      - kafka-2:/var/lib/kafka/data

  kafka-3:
    <<: *kafka
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,HOST://localhost:39092
    ports:
      - "127.0.0.1:39092:9094"
    volumes:
      - kafka-3:/var/lib/kafka/data

  initialize:
    <<: *app
    command: ["init"]
    environment: *app-env
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy

  producer-1:
    <<: *worker
    command: ["producer"]
    environment:
      <<: *app-env
      PRODUCER_ID: producer-1
  producer-2:
    <<: *worker
    command: ["producer"]
    environment:
      <<: *app-env
      PRODUCER_ID: producer-2
  producer-3:
    <<: *worker
    command: ["producer"]
    environment:
      <<: *app-env
      PRODUCER_ID: producer-3

  consumer-1:
    <<: *worker
    command: ["consumer"]
    environment:
      <<: *app-env
      CONSUMER_ID: consumer-1
  consumer-2:
    <<: *worker
    command: ["consumer"]
    environment:
      <<: *app-env
      CONSUMER_ID: consumer-2
  consumer-3:
    <<: *worker
    command: ["consumer"]
    environment:
      <<: *app-env
      CONSUMER_ID: consumer-3
      PROCESSING_DELAY_MS: ${CONSUMER_3_DELAY_MS:-${PROCESSING_DELAY_MS:-40}}

  tools:
    <<: *app
    profiles: ["tools"]
    command: ["verify"]
    environment: *app-env

volumes:
  kafka-1:
  kafka-2:
  kafka-3:
  sink:
